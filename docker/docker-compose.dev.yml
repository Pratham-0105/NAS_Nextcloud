services:
  postgres:
    image: postgres:16-alpine
    container_name: nas_postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: cloud_admin
      POSTGRES_PASSWORD: supersecure_admin_password_change_me
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nas_network

  redis:
    image: redis:7-alpine
    container_name: nas_redis
    restart: unless-stopped
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nas_network

  nextcloud:
    image: nextcloud:28-apache
    container_name: nas_nextcloud
    restart: unless-stopped
    ports:
      - "${NEXTCLOUD_HOST_PORT:-8085}:80"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: nextcloud
      POSTGRES_USER: cloud_admin
      POSTGRES_PASSWORD: supersecure_admin_password_change_me
      REDIS_HOST: redis
      NEXTCLOUD_ADMIN_USER: admin
      NEXTCLOUD_ADMIN_PASSWORD: admin123
      NEXTCLOUD_TRUSTED_DOMAINS: "localhost 127.0.0.1 0.0.0.0 nextcloud *.onrender.com *.trycloudflare.com"
      OVERWRITEPROTOCOL: "http"
    volumes:
      - nextcloud_dev_data:/var/www/html
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/status.php"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - nas_network

volumes:
  postgres_dev_data:
  redis_dev_data:
  nextcloud_dev_data:

networks:
  nas_network:
    driver: bridge
