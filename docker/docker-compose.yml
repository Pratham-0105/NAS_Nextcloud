services:
  caddy:
    image: caddy:2-alpine
    container_name: nas_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - user-portal
      - admin-portal
      - nextcloud
    networks:
      - nas_network

  postgres:
    image: postgres:16-alpine
    container_name: nas_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cloud_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-supersecure_admin_password_change_me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    networks:
      - nas_network

  redis:
    image: redis:7-alpine
    container_name: nas_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - nas_network

  nextcloud:
    image: nextcloud:28-apache
    container_name: nas_nextcloud
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: nextcloud
      POSTGRES_USER: ${POSTGRES_USER:-cloud_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-supersecure_admin_password_change_me}
      REDIS_HOST: redis
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER:-ncadmin}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD:-change_this_strong_nc_password}
      NEXTCLOUD_TRUSTED_DOMAINS: "localhost 127.0.0.1 0.0.0.0 nextcloud *.onrender.com *.trycloudflare.com"
    volumes:
      - /mnt/storage_pool/nextcloud_data:/var/www/html/data
      - nextcloud_apps:/var/www/html/custom_apps
      - nextcloud_config:/var/www/html/config
    networks:
      - nas_network

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: nas_backend
    restart: unless-stopped
    cap_add:
      - SYS_ADMIN
    volumes:
      - /dev:/dev:ro
      - /sys:/sys:ro
      - /run/udev:/run/udev:ro
      - /mnt:/mnt:rshared
    environment:
      - NODE_ENV=production
      - PORT=4000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-cloud_admin}:${POSTGRES_PASSWORD:-supersecure_admin_password_change_me}@postgres:5432/cloud_nas?schema=public
      - REDIS_URL=redis://redis:6379
      - NEXTCLOUD_INTERNAL_URL=http://nextcloud
      - NEXTCLOUD_ADMIN_USER=${NEXTCLOUD_ADMIN_USER:-ncadmin}
      - NEXTCLOUD_ADMIN_PASSWORD=${NEXTCLOUD_ADMIN_PASSWORD:-change_this_strong_nc_password}
      - STORAGE_POOL_PATH=/mnt/storage_pool
      - PHYSICAL_DEVICES_MOUNT_DIR=/mnt/devices
      - STORAGE_DETECTION_MODE=real
      - SIMULATE_STORAGE=false
    depends_on:
      - postgres
      - redis
    networks:
      - nas_network

  admin-portal:
    build:
      context: ../apps/admin-portal
      dockerfile: Dockerfile
    container_name: nas_admin_portal
    restart: unless-stopped
    environment:
      - PORT=3001
      - NEXT_PUBLIC_API_URL=/api
    networks:
      - nas_network

  user-portal:
    build:
      context: ../apps/user-portal
      dockerfile: Dockerfile
    container_name: nas_user_portal
    restart: unless-stopped
    environment:
      - PORT=3000
      - NEXT_PUBLIC_API_URL=/api
    networks:
      - nas_network

volumes:
  postgres_data:
  redis_data:
  nextcloud_apps:
  nextcloud_config:
  caddy_data:
  caddy_config:

networks:
  nas_network:
    driver: bridge
